server {
  listen 3000;

  # --- CORS for Vite dev (5173) ---
  add_header Access-Control-Allow-Origin "http://localhost:5173" always;
  add_header Vary Origin always;
  add_header Access-Control-Allow-Credentials true always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
  if ($request_method = OPTIONS) { return 204; }

  # --- Common proxy headers/timeouts ---
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;
  client_max_body_size 10m;

  # Prevent duplicate CORS headers from upstream services (Fastify CORS)
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Allow-Headers;

  # ---------- Product (match FIRST so it doesn't get caught by /v1/) ----------
  # Proxy product endpoints to product service on :4001
  # Use proxy_pass without a path to preserve the full original URI
  location ^~ /v1/products {
    proxy_pass http://product:4001;
  }
  location ^~ /v1/cart {
    proxy_pass http://product:4001;
  }
  # Product health via gateway
  location = /v1/product/health {
    proxy_pass http://product:4001/health;
  }

  # ---------- Auth ----------
  # Frontend may call /v1/auth/*; service serves /v1/* → strip 'auth/'
  location ^~ /v1/auth/ {
    proxy_pass http://user-auth:4000/v1/;   # /v1/auth/signup -> upstream /v1/signup
  }

  # Catch-all for other /v1/* auth endpoints like /v1/signup, /v1/login, /v1/me
  location ^~ /v1/ {
    proxy_pass http://user-auth:4000/v1/;
  }

  # Auth health
  location = /health {
    proxy_pass http://user-auth:4000/health;
  }
}
